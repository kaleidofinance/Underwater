<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>underwater.fun — X banner (1500×500)</title>
    <!--
      The X banner, as a page rather than a drawing.

      It is built from the site's own stylesheet values — the same three
      families, the same washi/goldleaf, the same water gradient and light
      shafts — so the banner and the app cannot drift apart. `brand/render.mjs`
      screenshots it at exactly 1500×500 (and again at 2×).

      Two constraints shaped the layout. X rounds the profile picture into a
      circle and hangs it over the banner's lower-left corner, so nothing that
      matters lives below y≈390 on the left. And the plate rules sit 40px in,
      close enough to the edge that a narrow crop takes them without taking any
      content with them.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Spectral:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #000;
        --ink: #e8e2d2;
        --goldleaf: #c9a24b;
        --ink-dim: rgb(232 226 210 / 54%);
        --ink-faint: rgb(232 226 210 / 30%);
        --hair: rgb(232 226 210 / 14%);
        --display: "Fraunces", Georgia, serif;
        --serif: "Spectral", Georgia, serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; margin: 0; }

      /* Magenta, so a capture that misses the banner's bounds is obvious in the
         PNG instead of passing as a black margin. */
      body { background: #f0f; }

      .banner {
        position: relative;
        width: 1500px;
        height: 500px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
      }

      /* ─── Water and light: the same two layers the site paints ─────────── */

      .water {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 95% at 20% -14%,
            rgb(46 122 140 / 26%),
            transparent 62%
          ),
          linear-gradient(
            180deg,
            rgb(46 122 140 / 30%) 0%,
            rgb(20 56 74 / 16%) 40%,
            rgb(18 18 20 / 0%) 78%
          );
      }

      .shafts {
        position: absolute;
        inset: -24% -8%;
        filter: blur(15px);
        opacity: 0.52;
      }
      .shafts i {
        position: absolute;
        top: -10%;
        height: 130%;
        background: linear-gradient(
          180deg,
          rgb(190 226 232 / 20%),
          transparent 74%
        );
        transform: skewX(-14deg);
      }
      .shafts i:nth-child(1) { left: 14%; width: 84px; }
      .shafts i:nth-child(2) { left: 27%; width: 34px; opacity: 0.7; }
      .shafts i:nth-child(3) { left: 58%; width: 62px; opacity: 0.55; }
      .shafts i:nth-child(4) { left: 74%; width: 26px; opacity: 0.45; }

      /* ─── Plate rules ─────────────────────────────────────────────────── */

      .frame {
        position: absolute;
        inset: 40px;
        border-top: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
      }
      /* Registration ticks: the short verticals a printed plate carries at the
         ends of its rules. */
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        top: -6px;
        height: 13px;
        width: 1px;
        background: var(--hair);
      }
      .frame::before { left: 0; }
      .frame::after { right: 0; }

      /* ─── Content ─────────────────────────────────────────────────────── */

      .inner {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 470px;
        align-items: center;
        gap: 56px;
        padding: 0 96px;
      }

      .mark { display: block; margin-bottom: 20px; }

      .kicker {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--goldleaf);
        margin-bottom: 16px;
      }

      /* Lifted verbatim from `.wordmark` in the app's globals.css. */
      .wordmark {
        font-family: var(--display);
        font-weight: 400;
        font-variation-settings: "SOFT" 30, "WONK" 1, "opsz" 120;
        font-size: 84px;
        line-height: 0.84;
        letter-spacing: -0.028em;
      }
      .wordmark em {
        font-style: normal;
        font-variation-settings: "SOFT" 80, "WONK" 1, "opsz" 144;
        font-weight: 300;
        color: var(--goldleaf);
      }

      .strap {
        font-family: var(--serif);
        font-weight: 300;
        font-size: 21px;
        line-height: 1.5;
        color: var(--ink-dim);
        max-width: 34ch;
        margin-top: 20px;
      }
      .strap b { font-weight: 400; color: var(--ink); }

      /* ─── The figure ──────────────────────────────────────────────────── */

      .fig { display: block; }
      .fig text {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        fill: var(--ink-faint);
      }
      .fig text.gold { fill: var(--goldleaf); }
      .fig text.dim { fill: var(--ink-dim); }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="water"></div>
      <div class="shafts"><i></i><i></i><i></i><i></i></div>
      <div class="frame"></div>

      <div class="inner">
        <div>
          <!-- The mark, inline so the banner renders from one file. -->
          <svg class="mark" viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
            <defs>
              <clipPath id="air"><rect x="0" y="0" width="64" height="35" /></clipPath>
              <clipPath id="sea"><rect x="0" y="35" width="64" height="29" /></clipPath>
            </defs>
            <path
              fill="#e8e2d2"
              clip-path="url(#air)"
              d="M31.4 7C33.6 14.2 38.8 20.4 42.2 26.6C45 31.6 46 35.2 46 38.4A14 14 0 0 1 18 38.4C18 35 19.1 31.4 22 26.4C25.4 20.2 29.6 14 31.4 7Z"
            />
            <path
              fill="#c9a24b"
              clip-path="url(#sea)"
              d="M31.4 7C33.6 14.2 38.8 20.4 42.2 26.6C45 31.6 46 35.2 46 38.4A14 14 0 0 1 18 38.4C18 35 19.1 31.4 22 26.4C25.4 20.2 29.6 14 31.4 7Z"
            />
          </svg>

          <div class="kicker">InkChain L2 · bonding curve · liquidity burned</div>
          <div class="wordmark">under<em>water</em>.fun</div>
          <p class="strap">
            Launch on a curve that prices itself. At <b>4 ETH</b> it graduates to
            a real pool and the LP is burned.
          </p>
        </div>

        <!-- FIG. 1 — the curve every launch runs, drawn from the real formula:
             price ∝ (1 + eth)² over a virtual 1 ETH reserve, so 4 ETH raised is
             exactly a 25× move. The points are sampled from that, not eyeballed. -->
        <svg class="fig" viewBox="0 0 470 300" width="470" height="300" aria-hidden="true">
          <!-- plot frame -->
          <line x1="54" y1="230" x2="434" y2="230" stroke="rgb(232 226 210 / 14%)" />
          <line x1="54" y1="40" x2="54" y2="230" stroke="rgb(232 226 210 / 14%)" />

          <!-- graduation: the ceiling the curve is built to reach -->
          <line
            x1="54" y1="40" x2="434" y2="40"
            stroke="#c9a24b" stroke-width="1.2" stroke-dasharray="5 5"
          />
          <text class="gold" x="434" y="31" text-anchor="end">Graduates · 25 gwei</text>

          <g transform="translate(54 40)">
            <polygon
              fill="rgb(232 226 210 / 6%)"
              points="0.0,190.0 11.9,187.9 23.8,185.5 35.6,182.9 47.5,180.1 59.4,177.0 71.3,173.7 83.1,170.1 95.0,166.3 106.9,162.2 118.8,157.8 130.6,153.3 142.5,148.4 154.4,143.4 166.3,138.0 178.1,132.5 190.0,126.7 201.9,120.6 213.8,114.3 225.6,107.7 237.5,100.9 249.4,93.9 261.3,86.6 273.1,79.0 285.0,71.3 296.9,63.2 308.8,54.9 320.6,46.4 332.5,37.6 344.4,28.6 356.3,19.3 368.1,9.8 380.0,0.0 380.0,190.0 0.0,190.0"
            />
            <polyline
              fill="none" stroke="#e8e2d2" stroke-width="1.6"
              stroke-linejoin="round" stroke-linecap="round"
              points="0.0,190.0 11.9,187.9 23.8,185.5 35.6,182.9 47.5,180.1 59.4,177.0 71.3,173.7 83.1,170.1 95.0,166.3 106.9,162.2 118.8,157.8 130.6,153.3 142.5,148.4 154.4,143.4 166.3,138.0 178.1,132.5 190.0,126.7 201.9,120.6 213.8,114.3 225.6,107.7 237.5,100.9 249.4,93.9 261.3,86.6 273.1,79.0 285.0,71.3 296.9,63.2 308.8,54.9 320.6,46.4 332.5,37.6 344.4,28.6 356.3,19.3 368.1,9.8 380.0,0.0"
            />
            <circle cx="380" cy="0" r="3.2" fill="#c9a24b" />
          </g>

          <text x="54" y="248">0</text>
          <text x="434" y="248" text-anchor="end">4 ETH raised</text>
          <text x="48" y="233" text-anchor="end">1</text>
          <text class="dim" x="54" y="278">Fig. 1 — price against ETH raised</text>
        </svg>
      </div>
    </div>
  </body>
</html>
