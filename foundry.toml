[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
evm_version = "cancun"
ffi = false

# The art contracts are size-bound, not gas-bound. All six are `view` only —
# marketplaces and wallets reach them through `eth_call`, so their runtime gas is
# paid by nobody, while their runtime *size* has a hard 24,576 B ceiling. At the
# project's 1,000,000 runs the optimizer inlines `LibString`, `Base64` and every
# `string.concat` so aggressively that the renderer lands 812 B under the limit;
# through the IR pipeline at 200 runs it emits the same bytes from 17.9 KB of code.
#
# Restricted by path rather than by lowering the project default, because the DEX
# and launchpad contracts are the opposite trade — hot paths, called in real
# transactions — and want all the inlining they can get. The restriction covers the
# whole directory rather than just the renderer so that every art contract has
# exactly one set of compiler settings: restrictions propagate to imports, so
# naming only the renderer would compile the four asset contracts under one profile
# when reached through it and another when reached directly, and "which bytes are
# on chain" is the one question this collection has to be able to answer.
[[profile.default.additional_compiler_profiles]]
name = "art"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[[profile.default.compilation_restrictions]]
paths = "src/nft/art/*.sol"
via_ir = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 10_000
max_test_rejects = 500_000

# forge test --profile deep
[profile.deep.fuzz]
runs = 250_000

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
sort_imports = true

# Verified live on 2026-08-23: chain IDs and RPCs confirmed against
# chainid.network and by querying both endpoints directly. The Robinhood pair was
# added and verified the same way on 2026-08-30 — note that the host chainlist
# carries, rpc.chain.robinhood.com, does not resolve at all; these two do.
[rpc_endpoints]
ink = "https://rpc-gel.inkonchain.com"
ink_sepolia = "https://rpc-gel-sepolia.inkonchain.com"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Ink runs Blockscout, which needs no API key. Verify with:
#   forge verify-contract <addr> <Contract> --chain 57073 \
#     --verifier blockscout --verifier-url https://explorer.inkonchain.com/api
#
# So does Robinhood, on both networks. The testnet's API answers a plain HTTP
# request; the mainnet's sits behind a Cloudflare interstitial that a CLI cannot
# pass, so a mainnet verification may have to be pasted into the explorer's own
# form instead. That is a Phase 5 problem — recorded here so it is not a surprise
# then.
[etherscan]
ink = {key = "", chain = 57073, url = "https://explorer.inkonchain.com/api"}
ink_sepolia = {key = "", chain = 763373, url = "https://explorer-sepolia.inkonchain.com/api"}
robinhood = {key = "", chain = 4663, url = "https://robinhoodchain.blockscout.com/api"}
robinhood_testnet = {key = "", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api"}
